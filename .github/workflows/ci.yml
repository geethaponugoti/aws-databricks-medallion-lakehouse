name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest, local SparkSession)
        run: pytest -q

  validate-bundle:
    name: Validate Databricks Asset Bundle
    runs-on: ubuntu-latest
    # Skipped until a DATABRICKS_HOST repo *variable* (Settings -> Secrets
    # and variables -> Actions -> Variables — it's a workspace URL, not
    # sensitive) and a DATABRICKS_TOKEN repo *secret* are set, and
    # databricks.yml's target workspace hosts are filled in (see setup step 2
    # in the README) — rather than a hard failure on every run before that's
    # done. (job-level `if:` can only see the vars context, not secrets —
    # that's why the gate is on the variable, not the token.)
    if: ${{ vars.DATABRICKS_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: databricks bundle validate
        run: databricks bundle validate -t dev
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
